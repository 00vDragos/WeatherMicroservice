version: "3.9"

services:
  grpc-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: grpc-server
    ports:
      - "50051:50051"
    env_file:
      - .env
    depends_on:
      - mongo

  grpc-client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: grpc-client
    stdin_open: true
    tty: true
    env_file:
      - .env
    depends_on:
      - grpc-server

  mongo:
    image: mongo:6
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
